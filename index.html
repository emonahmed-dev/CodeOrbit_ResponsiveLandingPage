<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Landing Page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="max-w-7xl mx-auto">
      <nav>
        <div class="flex items-center justify-between gap-3 py-6 lg:px-12 md:px-6">
          <img src="./assets/Nexora Logo.png" alt="logo" />
          <h2 class="font-bold text-xl">Nexora</h2>
        </div>
        <ul class="flex items-center justify-center gap-8">
          <li>Home</li>
          <li>Services</li>
          <li>Work</li>
          <li>About</li>
          <li>Pricing</li>
          <li>Contact</li>
        </ul>
        <div class="flex items-center justify-between gap-6 py-6 lg:px-12 md:px-6">
          <button class="bg-black text-white py-2.5 px-6 rounded-xl text-sm font-semibold">Get Started</button>
          <i class="fa-solid fa-circle-user text-3xl"></i>
        </div>
      </nav>
    </header>
    <script src="./script.js"></script>
  </body>
</html>
